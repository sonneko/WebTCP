name: Deploy GitHub Pages

# main への push（と手動実行）で公式ドキュメントサイトと公開デモを GitHub Pages へ配信する。
# 公開先: https://sonneko.github.io/WebTCP/（astro.config.mjs の site / base と対応）
# Pages の Source は「GitHub Actions」（build_type: workflow）であること。
# PR の検証は ci.yml の build-website / browser-e2e が担い、このワークフローは main のみ。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ライブラリのビルド成果物は公開デモ（examples/demo）が読み込む
      - name: Build library
        working-directory: webtcp_jslib
        run: |
          npm ci
          npm run build

      - name: Build website (includes the public demo)
        working-directory: webtcp_website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webtcp_website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
