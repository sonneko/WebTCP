name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtcp_jslib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_jslib/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtcp_website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_website/package-lock.json

      # 公開デモ（scripts/sync-demo.mjs）が webtcp_jslib/dist を複製するため、先にライブラリをビルドする
      - name: Build library (demo assets)
        working-directory: webtcp_jslib
        run: |
          npm ci
          npm run build

      - name: Install
        run: npm ci

      - name: Build website
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_jslib/package-lock.json

      - name: Build library
        working-directory: webtcp_jslib
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify 2-tab browser demo (real WebRTC)
        run: node examples/verify-browser.mjs

      - name: Verify signaling transports match (HTTP polling, SSE, WebSocket) (#45)
        run: node examples/verify-signaling-transports.mjs

      - name: Verify real-browser 2-tab connection over each signaling transport (#45)
        run: node examples/verify-signaling-browser.mjs

      - name: Verify AbortSignal aborts an in-flight real WebRTC connection (#44)
        run: node examples/verify-abort-browser.mjs

      - name: Build website (static Pages output)
        working-directory: webtcp_website
        run: |
          npm ci
          npm run build

      - name: Verify static Pages demo (no server)
        run: node examples/verify-static-demo.mjs
