name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtcp_jslib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_jslib/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webtcp_website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build website
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webtcp_jslib/package-lock.json

      - name: Build library
        working-directory: webtcp_jslib
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Verify 2-tab browser demo (real WebRTC)
        run: |
          set -o pipefail
          node examples/verify-browser.mjs 2>&1 | tee e2e.log
          code=$?
          if [ "$code" -ne 0 ]; then
            msg=$(tail -c 3000 e2e.log | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/:/%3A/g')
            echo "::error title=E2E log tail::${msg}"
          fi
          exit "$code"
